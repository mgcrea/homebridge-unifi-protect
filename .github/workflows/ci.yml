name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The codec specs run ffmpeg for real — verifyEncoder's whole job is to
      # find out whether an encoder actually starts, which cannot be faked. The
      # runners ship no ffmpeg, so without this the specs pass for the wrong
      # reason: every probe returns false, including the ones asserting true.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm run format:check
      - run: pnpm run spec
      - run: pnpm run build
